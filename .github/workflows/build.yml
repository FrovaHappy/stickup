name: Build and Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de versión a publicar'
        required: true
        type: choice
        options:
          - major
          - minor
          - fix
          - dev
        default: 'fix'

permissions:
  contents: write

jobs:
  prepare:
    name: Test & Bump Version
    runs-on: ubuntu-latest
    environment: release
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is_dev: ${{ steps.version.outputs.is_dev }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend typecheck
        run: pnpm run check

      - name: Run frontend tests
        run: npx vitest run

      - name: Build frontend
        run: pnpm run build

      - name: Run backend Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Bump version and commit
        id: version
        run: |
          if [ "${{ github.event.inputs.bump_type }}" == "dev" ]; then
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            if [[ "$CURRENT_VERSION" == *"-dev."* ]]; then
              npm version prerelease --preid=dev --no-git-tag-version
            else
              npm version prepatch --preid=dev --no-git-tag-version
            fi
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.bump_type }}" == "fix" ]; then
            npm version patch --no-git-tag-version
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
          else
            npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
          fi

          NEW_VERSION=$(node -p "require('./package.json').version")
          NEW_TAG="v$NEW_VERSION"

          # Sincronizar versión con tauri.conf.json y Cargo.toml
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];

            const tauriPath = "src-tauri/tauri.conf.json";
            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
            tauriConf.version = ver;
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + "\n");

            const cargoPath = "src-tauri/Cargo.toml";
            let cargoToml = fs.readFileSync(cargoPath, "utf8");
            cargoToml = cargoToml.replace(/^version\s*=\s*"[^"]*"/m, `version = "${ver}"`);
            fs.writeFileSync(cargoPath, cargoToml);
          ' "$NEW_VERSION"

          cargo check --manifest-path src-tauri/Cargo.toml

          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): $NEW_VERSION"
          git tag "$NEW_TAG"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        run: git push --follow-tags

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: bundle-windows
            bundle_paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            artifact_name: bundle-linux
            bundle_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: npx vitest run

      - name: Build frontend
        run: pnpm run build

      - name: Run backend Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri application
        run: pnpm tauri build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_paths }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.is_dev == 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.PAT_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        run: gh release create "${{ needs.prepare.outputs.tag }}" release-assets/* --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
