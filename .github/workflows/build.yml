name: Build and Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de versión a publicar'
        required: true
        type: choice
        options:
          - major
          - minor
          - fix
          - dev
        default: 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Test, Build (Linux & Windows) & Release
    runs-on: ubuntu-latest
    environment: release
    env:
      XWIN_CACHE_DIR: ${{ github.workspace }}/src-tauri/target/.xwin-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Linux & Cross-Compile system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            nsis \
            lld \
            llvm \
            clang

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Rust (Linux + Windows target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cargo-xwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend typecheck
        run: pnpm run check

      - name: Run frontend tests
        run: npx vitest run

      - name: Run backend Rust tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Bump version and commit locally
        id: version
        run: |
          if [ "${{ github.event.inputs.bump_type }}" == "dev" ]; then
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            if [[ "$CURRENT_VERSION" == *"-dev."* ]]; then
              npm version prerelease --preid=dev --no-git-tag-version
            else
              npm version prepatch --preid=dev --no-git-tag-version
            fi
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.bump_type }}" == "fix" ]; then
            npm version patch --no-git-tag-version
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
          else
            npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
          fi

          NEW_VERSION=$(node -p "require('./package.json').version")
          NEW_TAG="v$NEW_VERSION"

          node -e '
            const fs = require("fs");
            const ver = process.argv[1];

            const tauriPath = "src-tauri/tauri.conf.json";
            const tauriConf = JSON.parse(fs.readFileSync(tauriPath, "utf8"));
            tauriConf.version = ver.replace(/-dev\.(\d+)$/, "-$1");
            fs.writeFileSync(tauriPath, JSON.stringify(tauriConf, null, 2) + "\n");

            const cargoPath = "src-tauri/Cargo.toml";
            let cargoToml = fs.readFileSync(cargoPath, "utf8");
            cargoToml = cargoToml.replace(/^version\s*=\s*"[^"]*"/m, `version = "${ver}"`);
            fs.writeFileSync(cargoPath, cargoToml);

            const lockPath = "src-tauri/Cargo.lock";
            if (fs.existsSync(lockPath)) {
              let cargoLock = fs.readFileSync(lockPath, "utf8");
              cargoLock = cargoLock.replace(/(name = "app"\r?\nversion = ")[^"]*(")/, `$1${ver}$2`);
              fs.writeFileSync(lockPath, cargoLock);
            }
          ' "$NEW_VERSION"

          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): $NEW_VERSION"
          git tag -a "$NEW_TAG" -m "chore(release): $NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Tauri for Linux (.deb, .AppImage & binary)
        run: pnpm tauri build --bundles deb,appimage

      - name: Build Tauri for Windows (.exe NSIS & binary)
        run: pnpm tauri build --runner cargo-xwin --target x86_64-pc-windows-msvc --bundles nsis --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect installers and uncompressed binaries
        run: |
          mkdir -p release-assets/installers release-assets/binaries
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/installers/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/installers/
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe release-assets/installers/
          cp src-tauri/target/release/app release-assets/binaries/stickup-linux-x64
          cp src-tauri/target/x86_64-pc-windows-msvc/release/app.exe release-assets/binaries/stickup-windows-x64.exe

      - name: Push commit and tag
        run: git push origin HEAD "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: ${{ steps.version.outputs.is_dev == 'false' }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            release-assets/installers/* \
            release-assets/binaries/stickup-linux-x64 \
            release-assets/binaries/stickup-windows-x64.exe \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
